name: OpenWrt 25.12 Upstream Sync for Smartdns and WebUI

permissions:
  contents: write

on:
  schedule:
    - cron: '36 */4 * * *'  # UTC，每 4 小时的第 36 分钟
  workflow_dispatch:

concurrency:
  group: smartdns-upstream-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # 使用 PAT，触发下游 on: push 的编译工作流
          token: ${{ secrets.PAT_WORKFLOW }}
          persist-credentials: true

      - name: Get latest upstream commits
        shell: bash
        run: |
          get_commit() {
            curl --fail --silent --show-error --retry 2 --max-time 30 \
              -H "Accept: application/vnd.github+json" "$1" |
              jq -er '.sha | strings | select(test("^[0-9a-f]{40}$"))'
          }

          if ! smartdns_commit=$(get_commit \
            https://api.github.com/repos/pymumu/smartdns/commits/master); then
            echo "::error::Failed to fetch a valid SmartDNS commit SHA."
            exit 1
          fi

          if ! webui_commit=$(get_commit \
            https://api.github.com/repos/pymumu/smartdns-webui/commits/main); then
            echo "::warning::Could not fetch the WebUI commit SHA. Keeping the current WebUI version."
            webui_commit=
          fi

          {
            echo "LATEST_SMARTDNS_COMMIT=$smartdns_commit"
            echo "LATEST_WEBUI_COMMIT=$webui_commit"
          } >> "$GITHUB_ENV"

      - name: Update Makefile and push
        shell: bash
        run: |
          update_version() {
            local key="$1"
            local version="$2"
            local count

            count=$(grep -c "^${key}:=" Makefile || true)
            if [[ "$count" != 1 ]]; then
              echo "::error file=Makefile::Expected exactly one ${key}:= assignment."
              return 1
            fi

            sed -i "s/^${key}:=.*/${key}:=${version}/" Makefile
          }

          update_version PKG_SOURCE_VERSION "$LATEST_SMARTDNS_COMMIT"
          if [[ -n "$LATEST_WEBUI_COMMIT" ]]; then
            update_version SMARTDNS_WEBUI_SOURCE_VERSION "$LATEST_WEBUI_COMMIT"
          fi

          if git diff --quiet -- Makefile; then
            echo "No changes needed."
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -- Makefile
          git commit -m "chore: bump smartdns/webui for OpenWrt 25.12"

          target_ref="refs/heads/$GITHUB_REF_NAME"

          for attempt in 1 2 3; do
            git fetch origin "$target_ref"
            base=$(git rev-parse FETCH_HEAD)

            if ! git rebase "$base"; then
              git rebase --abort
              echo "::error::Remote changes conflict with this version update. Rerun the workflow to read the latest Makefile."
              exit 1
            fi

            if [[ "$(git rev-parse HEAD)" == "$base" ]]; then
              echo "The update is already present on the remote branch."
              exit 0
            fi

            if git push origin "HEAD:$target_ref"; then
              exit 0
            fi

            git fetch origin "$target_ref"
            if [[ "$(git rev-parse FETCH_HEAD)" == "$base" ]]; then
              echo "::error::Push failed without a remote branch update. Check the git push error above."
              exit 1
            fi

            echo "Remote branch advanced during push (attempt $attempt of 3)."
          done

          echo "::error::Remote branch kept advancing. Push failed after 3 attempts."
          exit 1
